name: Infra (Terraform)

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Workspace
        type: choice
        options: [stg, prd]
        default: stg
      action:
        description: plan, apply or destroy
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  # On PRs: no credentials, just fmt + validate.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - name: fmt & validate
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: infra
    env:
      AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || (secrets.AWS_ACCESS_KEY_ID != '' && 'static' || 'oidc') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_AUTH_MODE == 'oidc'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (static)
        if: env.AWS_AUTH_MODE == 'static'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Resolve state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=auto-repair-shop-tfstate-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Terraform ${{ inputs.action }} (${{ inputs.environment }})
        working-directory: terraform
        run: |
          terraform init -backend-config="bucket=$STATE_BUCKET"
          terraform workspace select "${{ inputs.environment }}" 2>/dev/null \
            || terraform workspace new "${{ inputs.environment }}"
          terraform ${{ inputs.action }} ${{ (inputs.action == 'apply' || inputs.action == 'destroy') && '-auto-approve' || '' }} \
            -var "state_bucket=$STATE_BUCKET"

      - name: Show outputs
        if: inputs.action == 'apply'
        working-directory: terraform
        run: terraform output
