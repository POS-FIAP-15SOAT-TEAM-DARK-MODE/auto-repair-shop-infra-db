name: Infra (Terraform)

on:
  pull_request:
    paths:
      - "terraform/**"
      - "db-bootstrap/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Workspace
        type: choice
        options: [stg, prd]
        default: stg
      action:
        description: plan, apply or destroy
        type: choice
        options: [plan, apply, destroy]
        default: plan
      layer:
        description: "db = RDS, secrets and database bootstrap (terraform/); dynamodb = history table (terraform/dynamodb/)"
        type: choice
        options: [db, dynamodb]
        default: db

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  # On PRs: no credentials, just fmt + validate of both states and a syntax
  # check of the bootstrap script.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - name: fmt & validate
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform/dynamodb init -backend=false -input=false
          terraform -chdir=terraform/dynamodb validate
      - name: bootstrap script syntax
        run: sh -n db-bootstrap/bootstrap.sh

  # On PRs: plan-free end-to-end check of the DynamoDB layer against MiniStack
  # (AWS emulator). No AWS credentials are used.
  dynamodb-ministack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack
        ports:
          - 4566:4566
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      MINISTACK_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - name: Wait for MiniStack
        run: |
          for i in $(seq 1 30); do
            # Any HTTP answer means the endpoint is up (curl exits 0 for 4xx/5xx too).
            if curl -s -o /dev/null "$MINISTACK_ENDPOINT/"; then
              echo "MiniStack is up"
              exit 0
            fi
            sleep 2
          done
          echo "MiniStack did not respond on $MINISTACK_ENDPOINT" >&2
          exit 1
      - name: Terraform init & apply (dynamodb, MiniStack)
        run: |
          # The emulator run keeps its state local: the S3 backend is for AWS only.
          # Written on the runner only, never committed.
          printf 'terraform {\n  backend "local" {}\n}\n' > terraform/dynamodb/backend_override.tf
          terraform -chdir=terraform/dynamodb init -input=false
          terraform -chdir=terraform/dynamodb apply -auto-approve -input=false \
            -var aws_endpoint="$MINISTACK_ENDPOINT"
      - name: Describe history table
        run: |
          aws --endpoint-url "$MINISTACK_ENDPOINT" dynamodb describe-table \
            --table-name auto-repair-shop-stg-history \
            --query 'Table.{Name:TableName,Status:TableStatus,Keys:KeySchema}' \
            --output json

  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: infra
    env:
      AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || (secrets.AWS_ACCESS_KEY_ID != '' && 'static' || 'oidc') }}
      ACTION: ${{ inputs.action }}
      LAYER: ${{ inputs.layer }}
      ENVIRONMENT: ${{ inputs.environment }}
      TF_DIR: ${{ inputs.layer == 'dynamodb' && 'terraform/dynamodb' || 'terraform' }}
      NS: auto-repair-shop
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || format('auto-repair-shop-{0}-eks', inputs.environment) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_AUTH_MODE == 'oidc'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (static)
        if: env.AWS_AUTH_MODE == 'static'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Resolve state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=auto-repair-shop-tfstate-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Terraform ${{ inputs.action }} (${{ inputs.layer }} / ${{ inputs.environment }})
        run: |
          terraform -chdir="$TF_DIR" init -backend-config="bucket=$STATE_BUCKET"
          terraform -chdir="$TF_DIR" workspace select "$ENVIRONMENT" 2>/dev/null \
            || terraform -chdir="$TF_DIR" workspace new "$ENVIRONMENT"
          # state_bucket is only needed by the db layer (remote_state for the network).
          VARS=""
          if [ "$LAYER" = "db" ]; then VARS="-var state_bucket=$STATE_BUCKET"; fi
          case "$ACTION" in
            apply|destroy) terraform -chdir="$TF_DIR" "$ACTION" -auto-approve $VARS ;;
            *)             terraform -chdir="$TF_DIR" "$ACTION" $VARS ;;
          esac

      - name: Bootstrap databases (db-bootstrap Job)
        if: inputs.action == 'apply' && inputs.layer == 'db'
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

          DB_HOST=$(terraform -chdir=terraform output -raw db_host)
          SERVICE_ARNS=$(terraform -chdir=terraform output -json service_secret_arns)
          LAMBDA_ARN=$(terraform -chdir=terraform output -raw lambda_secret_arn)

          # Reads POSTGRES_PASSWORD of a secret; values are masked and written only to a 0600 file.
          read_pw() {
            local secret_id="$1"
            aws secretsmanager get-secret-value --secret-id "$secret_id" --query SecretString --output text \
              | jq -r '.POSTGRES_PASSWORD'
          }
          add_pw() { # add_pw <ENV_NAME> <secret-id>
            local env_name="$1"
            local secret_id="$2"
            local v
            v=$(read_pw "$secret_id")
            echo "::add-mask::$v"
            echo "$env_name=$v" >> "$ENV_FILE"
          }
          svc_arn() {
            local key="$1"
            echo "$SERVICE_ARNS" | jq -r --arg k "$key" '.[$k]'
          }

          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT
          : > "$ENV_FILE"
          echo "PGHOST=$DB_HOST" >> "$ENV_FILE"
          echo "PGUSER=postgres" >> "$ENV_FILE"
          echo "PGSSLMODE=require" >> "$ENV_FILE"
          add_pw PGPASSWORD "auto-repair-shop-${ENVIRONMENT}/app"
          add_pw PW_CUSTOMER "$(svc_arn customer)"
          add_pw PW_CATALOG "$(svc_arn catalog)"
          add_pw PW_BILLING "$(svc_arn billing)"
          add_pw PW_EXECUTION "$(svc_arn execution)"
          add_pw PW_SERVICE_ORDER "$(svc_arn service-order)"
          add_pw PW_LAMBDA "$LAMBDA_ARN"

          kubectl -n "$NS" create secret generic db-bootstrap \
            --from-env-file="$ENV_FILE" --dry-run=client -o yaml | kubectl -n "$NS" apply -f -
          kubectl -n "$NS" create configmap db-bootstrap-script \
            --from-file=bootstrap.sh=db-bootstrap/bootstrap.sh --dry-run=client -o yaml | kubectl -n "$NS" apply -f -

          # Job spec is immutable: delete any finished Job from a previous run first.
          kubectl -n "$NS" delete job db-bootstrap --ignore-not-found --wait=true
          kubectl -n "$NS" apply -f db-bootstrap/job.yaml
          if ! kubectl -n "$NS" wait --for=condition=complete --timeout=300s job/db-bootstrap; then
            kubectl -n "$NS" logs job/db-bootstrap --all-containers || true
            exit 1
          fi
          kubectl -n "$NS" logs job/db-bootstrap

      - name: Remove db-bootstrap Secret
        if: always() && inputs.action == 'apply' && inputs.layer == 'db'
        run: kubectl -n "$NS" delete secret db-bootstrap --ignore-not-found

      - name: Show outputs
        if: inputs.action == 'apply'
        run: terraform -chdir="$TF_DIR" output
